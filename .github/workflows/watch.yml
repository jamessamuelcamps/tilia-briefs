name: Watch Notion

on:
  schedule:
    # GitHub runs these late when it's busy, so expect 5 to 15 minutes after a status change.
    - cron: '*/5 * * * *'
  workflow_dispatch:

# One run at a time, so a slow publish can't be picked up twice.
concurrency:
  group: watch
  cancel-in-progress: false

jobs:
  watch:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
      NOTION_TOKEN: ${{ secrets.NOTION_TOKEN }}
      NOTION_DATABASE_ID: ${{ secrets.NOTION_DATABASE_ID }}
      SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
      PORTFOLIO_TOKEN: ${{ secrets.PORTFOLIO_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Look for Drafted or Ready pages
        id: check
        run: node scripts/watch.mjs --check
      # Most runs find nothing and stop here.
      - if: steps.check.outputs.pending == 'true'
        run: npm install -g @anthropic-ai/claude-code
      - name: Sub-edit and publish
        if: steps.check.outputs.pending == 'true'
        run: node scripts/watch.mjs
