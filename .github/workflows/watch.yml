name: Watch Notion

on:
  schedule:
    # Every 30 minutes, 06:00 to 22:30 UTC (about 07:00 to 23:00 UK), every day. Most runs only ask
    # Notion whether anything is waiting, which costs nothing. GitHub runs these late when it's busy.
    - cron: '*/30 6-22 * * *'
  workflow_dispatch:

# One run at a time, so a slow publish can't be picked up twice.
concurrency:
  group: watch
  cancel-in-progress: false

jobs:
  watch:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
      NOTION_TOKEN: ${{ secrets.NOTION_TOKEN }}
      NOTION_DATABASE_ID: ${{ secrets.NOTION_DATABASE_ID }}
      NOTION_USER_ID: ${{ secrets.NOTION_USER_ID }}
      SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
      PORTFOLIO_TOKEN: ${{ secrets.PORTFOLIO_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Look for Drafted or Ready pages
        id: check
        run: node scripts/watch.mjs --check
      # Most runs find nothing and stop here.
      - name: Install Claude Code
        id: install
        if: steps.check.outputs.pending == 'true'
        run: npm install -g @anthropic-ai/claude-code
      - name: Sub-edit and publish
        if: steps.check.outputs.pending == 'true'
        run: node scripts/watch.mjs
      # The scripts report their own failures; this covers the install step.
      - name: Say if Claude Code couldn't be installed
        if: failure() && steps.install.outcome == 'failure'
        run: node scripts/alert.mjs "The Notion watcher couldn't install Claude Code"
