name: Weekly briefs

on:
  schedule:
    # GitHub cron runs in UTC. Both fire; the script only proceeds for the one that is 18:00 UK time.
    - cron: '0 17 * * 0,2' # 18:00 UK during British Summer Time
    - cron: '0 18 * * 0,2' # 18:00 UK during GMT
  workflow_dispatch:
    inputs:
      channel:
        description: Which brief to send now
        type: choice
        options: [personal, personal-short, make]
        default: personal
      dry_run:
        description: Print the brief in the log without touching Notion or Slack
        type: boolean
        default: true

jobs:
  brief:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
      NOTION_TOKEN: ${{ secrets.NOTION_TOKEN }}
      NOTION_DATABASE_ID: ${{ secrets.NOTION_DATABASE_ID }}
      NOTION_USER_ID: ${{ secrets.NOTION_USER_ID }}
      SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Install Claude Code
        id: install
        run: npm install -g @anthropic-ai/claude-code
      - name: Test
        id: test
        run: npm test
      - name: Send brief
        env:
          SCHEDULE: ${{ github.event.schedule }}
          CHANNEL: ${{ inputs.channel }}
          DRY_RUN: ${{ inputs.dry_run }}
        run: |
          if [ "${{ github.event_name }}" = "schedule" ]; then
            node scripts/run.mjs --scheduled
          elif [ "$DRY_RUN" = "true" ]; then
            node scripts/run.mjs "$CHANNEL" --dry-run
          else
            node scripts/run.mjs "$CHANNEL" --force
          fi
      # The brief script reports its own failures; this covers the steps before it.
      - name: Say if it failed before the brief ran
        if: failure() && (steps.install.outcome == 'failure' || steps.test.outcome == 'failure')
        run: node scripts/alert.mjs "This week's brief failed before it started"
